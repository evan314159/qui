name: Fork publish

on:
  push:
    branches:
      - combined

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: distrib/docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=v1.31.1-search-resizable-columns
            GIT_COMMIT=${{ github.sha }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/qui:search-resizable-columns

      - name: Print digest
        run: echo "digest=${{ steps.push.outputs.digest }}"
