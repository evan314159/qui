name: Fork publish

on:
  push:
    branches:
      - combined

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: distrib/docker/Dockerfile
          platforms: linux/amd64
          # One package version per build, so retention counts images, not attestations.
          provenance: false
          sbom: false
          build-args: |
            VERSION=v1.31.1-combined-${{ steps.sha.outputs.short }}
            GIT_COMMIT=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/qui:combined
            ghcr.io/${{ github.repository_owner }}/qui:combined-${{ steps.sha.outputs.short }}

      - name: Print digest
        run: echo "digest=${{ steps.push.outputs.digest }}"

      - name: Keep the last 5 images
        uses: actions/delete-package-versions@v5.0.0
        with:
          package-name: qui
          package-type: container
          min-versions-to-keep: 5
